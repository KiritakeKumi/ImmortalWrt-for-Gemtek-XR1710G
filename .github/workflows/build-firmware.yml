name: Build Router Firmware

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release Type'
        required: true
        default: 'none'
        type: choice
        options:
          - none
          - release
          - prerelease
      release_notes:
        description: 'Release Notes'
        required: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    outputs:
      date: ${{ steps.version.outputs.date }}
      repo_commit: ${{ steps.version.outputs.repo_commit }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Generate build version
        id: version
        run: |
          git remote add upstream https://github.com/immortalwrt/immortalwrt.git 2>/dev/null || true
          git remote set-url upstream https://github.com/immortalwrt/immortalwrt.git
          git fetch --no-tags upstream master

          build_time=$(TZ=Asia/Shanghai date +'%Y%m%d-%H%M%S')
          repo_commit=$(git rev-parse --short=10 HEAD)
          upstream_base=$(git merge-base HEAD upstream/master)
          upstream_commit=$(git rev-parse --short=10 "$upstream_base")
          version="xr1710g-${build_time}-${repo_commit}-${upstream_commit}"

          echo "date=${build_time%%-*}" >> $GITHUB_OUTPUT
          echo "repo_commit=$repo_commit" >> $GITHUB_OUTPUT
          echo "upstream_commit=$upstream_commit" >> $GITHUB_OUTPUT
          echo "version=$version" >> $GITHUB_OUTPUT
          echo "Build version: $version"

      - name: Setup build environment
        run: |
          sudo apt update
          sudo apt install -y build-essential clang gcc g++ binutils bzip2 gawk gettext git libncurses-dev libssl-dev python3 python3-setuptools rsync unzip wget xsltproc zlib1g-dev file which perl sed make

      - name: Install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          bash scripts/apply-feed-patches.sh

      - name: Configure
        run: |
          cp config.seed .config
          sed -i -e '/^CONFIG_VERSION_DIST=/d' \
                 -e '/^# CONFIG_VERSION_DIST is not set$/d' \
                 -e '/^CONFIG_VERSION_NUMBER=/d' \
                 -e '/^# CONFIG_VERSION_NUMBER is not set$/d' .config
          echo 'CONFIG_VERSION_DIST="ImmortalWrt XR1710G"' >> .config
          echo 'CONFIG_VERSION_NUMBER="${{ steps.version.outputs.version }}"' >> .config
          make defconfig

      - name: Download sources
        run: make download -j$(nproc)

      - name: Build Firmware
        shell: bash
        run: |
          set -o pipefail

          if make -j2 world 2>&1 | tee build.log; then
            exit 0
          fi

          build_status=${PIPESTATUS[0]}
          echo "Parallel build failed with status $build_status."
          echo "Re-running target/linux serially with verbose output for diagnosis."
          make -j1 V=sc target/linux/compile 2>&1 | tee target-linux-debug.log || true
          exit "$build_status"

      - name: Check build status
        if: always()
        run: |
          if [ -f build.log ]; then
            tail -100 build.log
          fi
          if [ -f target-linux-debug.log ]; then
            echo "=== Verbose target/linux failure ==="
            tail -300 target-linux-debug.log
          fi
          echo "=== List all files in bin/targets/airoha/an7581/ ==="
          ls -la bin/targets/airoha/an7581/ 2>/dev/null || echo "No files found in an7581 directory"
          echo "=== List all files in bin/targets/airoha/ ==="
          ls -la bin/targets/airoha/ 2>/dev/null || echo "No files found in airoha directory"
          echo "=== List all files in bin/targets/ ==="
          ls -la bin/targets/ 2>/dev/null || echo "No files found in targets directory"
          echo "=== List all files in bin/ ==="
          ls -la bin/ 2>/dev/null || echo "No files found in bin directory"

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: router-firmware
          path: |
            build.log
            target-linux-debug.log
            bin/targets/airoha/an7581/*.itb
            bin/targets/airoha/an7581/config.buildinfo
            bin/targets/airoha/an7581/feeds.buildinfo
            bin/targets/airoha/an7581/version.buildinfo
            bin/targets/airoha/an7581/sha256sums
          retention-days: 30
        if: always()

  release:
    if: github.event.inputs.release_type != 'none'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download firmware artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: router-firmware
          path: release-artifacts

      - name: Build release body
        id: release_body
        env:
          RELEASE_NOTES: ${{ github.event.inputs.release_notes }}
        run: |
          {
            printf '%s\n' "$RELEASE_NOTES"
          } > /tmp/release_body.md
          {
            echo "body<<EOF"
            cat /tmp/release_body.md
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@5113cdc90fd4d541c801c55356214017bf5ae34b # v3
        with:
          tag_name: ${{ format('{0}-{1}', needs.build.outputs.date, needs.build.outputs.repo_commit) }}
          name: ${{ format('{0} - XR1710G Build ({1})', needs.build.outputs.date, needs.build.outputs.repo_commit) }}
          body: ${{ steps.release_body.outputs.body }}
          draft: false
          prerelease: ${{ github.event.inputs.release_type == 'prerelease' }}
          files: |
            release-artifacts/*.itb
            release-artifacts/config.buildinfo
            release-artifacts/feeds.buildinfo
            release-artifacts/version.buildinfo
            release-artifacts/sha256sums
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
